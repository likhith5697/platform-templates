---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-create
  namespace: orders
  labels:
    app.kubernetes.io/managed-by: render_httproutes
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: gateway-system
  rules:
  - matches:
    - path:
        type: Exact
        value: /orders
      method: POST
    backendRefs:
    - name: orders
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-list
  namespace: orders
  labels:
    app.kubernetes.io/managed-by: render_httproutes
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: gateway-system
  rules:
  - matches:
    - path:
        type: Exact
        value: /orders
      method: GET
    backendRefs:
    - name: orders
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-get
  namespace: orders
  labels:
    app.kubernetes.io/managed-by: render_httproutes
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: gateway-system
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: /orders/[^/]+
      method: GET
    backendRefs:
    - name: orders
      port: 8080
