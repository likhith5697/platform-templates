# This repo's own CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  TF_VERSION: 1.14.6
  TF_IN_AUTOMATION: "true"

jobs:
  # Dogfood the reusable workflow on the example routes file, using THIS commit's tools (not the last release).
  validate-example:
    uses: ./.github/workflows/validate.yml
    with:
      routes_file: examples/routes.yaml
      templates_ref: ${{ github.sha }}

  # Release guard: on a tag push, validate.yml's templates_ref default must equal the tag,
  # otherwise callers pinning @<tag> would run another version's tools.
  release-guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: templates_ref default == tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          default=$(grep -A12 '^      templates_ref:' .github/workflows/validate.yml | grep -m1 -E '^[[:space:]]+default:' | awk '{print $2}')
          echo "tag=$TAG validate.yml default=$default"
          test "$default" = "$TAG" || { echo "::error::Bump templates_ref default in validate.yml to $TAG"; exit 1; }

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest -q

  terraform-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check (whole repo)
        run: terraform fmt -check -recursive -diff
      - name: terraform test (each module; mocked AWS provider, no credentials)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "::group::test $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done
      - name: terraform validate (example root module)
        run: |
          terraform -chdir=examples/api-gateway-routes init -backend=false -input=false -no-color
          terraform -chdir=examples/api-gateway-routes validate -no-color
